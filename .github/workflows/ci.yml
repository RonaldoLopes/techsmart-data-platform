name: CI/CD TechSmart

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------- 1) Qualidade
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyspark==3.5.0 pytest ruff

      - name: Lint
        run: ruff check .

      - name: Testes unitarios
        run: pytest tests/ -v

